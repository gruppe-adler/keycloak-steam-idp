name: Build and Publish to GitHub Packages

on:
  release:
    types: [published]

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Fill in the release description from the PRs merged since the previous
      # release, grouped by .github/release.yml. Hand-written notes are kept.
      - name: Generate release notes
        if: github.event.release.body == ''
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}

      # Without a title GitHub shows the tagged commit's message (e.g. a merge commit).
      - name: Use tag as release title
        if: github.event.release.name == ''
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set version from release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Publishing version $VERSION"

      - name: Build and test with Maven
        run: mvn -B package --file pom.xml

      - name: Publish to GitHub Packages
        run: mvn -B deploy --file pom.xml -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
